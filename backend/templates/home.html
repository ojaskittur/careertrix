<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAREERTRIX</title>
    <img src="{% static 'image/logo.png' %}" alt="Logo" class="logo" />
    <link rel="stylesheet" href="{% static 'styles/main.css' %}" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="header" id="shell-bar">
      <div class="container">
        <a href="#top" class="logo-link">
          <img src="{% static 'image/logo.png' %}" alt="Logo" class="logo" />
        </a>
        <h1 class="title">
          <span class="magic">
            <span class="magic-star">
              <svg viewBox="0 0 512 512">
                <path
                  d="M512 255.1c0 11.34-7.406 20.86-18.44 23.64l-171.3 42.78l-42.78 171.1C276.7 504.6 267.2 512 255.9 512s-20.84-7.406-23.62-18.44l-42.66-171.2L18.47 279.6C7.406 276.8 0 267.3 0 255.1c0-11.34 7.406-20.83 18.44-23.61l171.2-42.78l42.78-171.1C235.2 7.406 244.7 0 256 0s20.84 7.406 23.62 18.44l42.78 171.2l171.2 42.78C504.6 235.2 512 244.6 512 255.1z"
                />
              </svg>
            </span>
            <span class="magic-star">
              <svg viewBox="0 0 512 512">
                <path
                  d="M512 255.1c0 11.34-7.406 20.86-18.44 23.64l-171.3 42.78l-42.78 171.1C276.7 504.6 267.2 512 255.9 512s-20.84-7.406-23.62-18.44l-42.66-171.2L18.47 279.6C7.406 276.8 0 267.3 0 255.1c0-11.34 7.406-20.83 18.44-23.61l171.2-42.78l42.78-171.1C235.2 7.406 244.7 0 256 0s20.84 7.406 23.62 18.44l42.78 171.2l171.2 42.78C504.6 235.2 512 244.6 512 255.1z"
                />
              </svg>
            </span>
            <span class="magic-star">
              <svg viewBox="0 0 512 512">
                <path
                  d="M512 255.1c0 11.34-7.406 20.86-18.44 23.64l-171.3 42.78l-42.78 171.1C276.7 504.6 267.2 512 255.9 512s-20.84-7.406-23.62-18.44l-42.66-171.2L18.47 279.6C7.406 276.8 0 267.3 0 255.1c0-11.34 7.406-20.83 18.44-23.61l171.2-42.78l42.78-171.1C235.2 7.406 244.7 0 256 0s20.84 7.406 23.62 18.44l42.78 171.2l171.2 42.78C504.6 235.2 512 244.6 512 255.1z"
                />
              </svg> </span
            ><span class="magic-text"><a href="{% url 'home' %}">CAREERTRIX</a></span>
          </span>
        </h1>
        <nav class="navbar">
          <ul>
            <li><a href="{% url 'setting' %}">PROFILE</a></li>
            <li><a href="{% url 'registration' %}">REGISTRATION</a></li>
          </ul>
        </nav>
        <!-- Logout Button -->
        <a id="profile-user">
          <i class="fa fa-user-circle fa-2x"></i>
        </a>
        <a class="profile-user" style="margin-left: 15px;">
          <span>{{ request.user.username }}</span>
        </a>
        <a href="{% url 'signout' %}" class="logout-btn" style="margin-right: 50px;">Logout</a>
      </div>
      </div>
    </header>
    <div class="container">
      <!-- Side Navigation Bar -->
      <aside class="side-nav">
        <ul>
          <li><a class="link" href="#skill">Roadmap</a></li>
          <li><a class="link" href="#trending-jobs">Trending Jobs</a></li>
        </ul>
      </aside>

      <!-- Main Content Area -->
      <main class="content-area" >
<!-- Job and Skill Selection Section -->
<section class="job-skill-selection" id="skill">
  <form action="" method="post">
    {% csrf_token %}
    <h2>Roadmap</h2>
    <div id="col" style="display: flex; flex-direction: column;">
      <label for="job-dropdown">Desiered Jobs:</label>
      <input type="text" name="job-dropdown" id="job-dropdown">
    </div>
    <button id="generate-button" type="submit">Generate</button>
  </form>
  <br><br>
  <h2>Previous Roadmaps:</h2>
  <br>
  <div class="roadmap-buttons-container">
    {% for response in previous_responses %}
        <form method="POST" action="{% url 'home' %}">
            {% csrf_token %}
            <button type="submit" name="job-dropdown" value="{{ response.field }}" id="generate-button">
                {{ response.field }}
            </button>
        </form>
    {% endfor %}
  </div>
</section>
<section class="trending-jobs" id="trending-jobs">
  <h1>Trending Jobs</h1>
  <!-- Search will be inserted here by JavaScript -->
  <div id="cards"></div>
</section>
      </main>
    </div>
      <script src="https://cdn.botpress.cloud/webchat/v2.1/inject.js"></script>
      <script src="https://mediafiles.botpress.cloud/3177457b-276e-453f-abbe-3fe6165f9843/webchat/v2.1/config.js"></script>
      <script src="{% static 'script/main.js' %}"></script>
  </body>
</html>
